[package]
name = "cs_engine"
version = "0.1.0"
edition = "2021"
description = "plan 78: the end-to-end system's one Python entry (called once per move)"

[lib]
name = "cs_engine"
crate-type = ["cdylib"]

[dependencies]
cs_game = { path = "../game" }
cs_gdl = { path = "../gdl" }
cs_decision = { path = "../decision" }
cs_operator = { path = "../operator" }
cs_memory = { path = "../memory" }
serde_json = "1"
rayon = "1"
cs_tactics = { path = "../tactics" }
cs_planning = { path = "../planning" }
cs_learn = { path = "../learn" }
pyo3 = { version = "0.25", features = ["extension-module"] }
