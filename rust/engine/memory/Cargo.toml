[package]
name = "cs_memory"
version = "0.1.0"
edition = "2021"
description = "plan 78.14: the memory layer -- content-addressed store snapshots, the lemma language (restricted Datalog over the fact vocabulary), its one matcher, the card corpus lemmas are verified on, and the lemma operator (game-free: it reads only the Game trait)"

[dependencies]
cs_game = { path = "../game" }
cs_operator = { path = "../operator" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
cs_gdl = { path = "../gdl" }
