[package]
name = "catspace-concepts"
version = "0.1.0"
edition = "2021"
description = "Named chess board probes for concept-program distillation"

[lib]
name = "catspace_concepts"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
shakmaty = "0.30"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
