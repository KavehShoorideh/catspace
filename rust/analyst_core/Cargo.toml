[package]
name = "analyst_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "analyst_core"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
maia-chess = { path = "../maia-chess" }
ascent = "0.8.1"
pyo3 = { version = "0.25", features = ["extension-module"] }
shakmaty = "0.27"
cs_gdl = { path = "../engine/gdl" }        # plan 78.1: the spec evaluator, its own crate (rust/engine/gdl), shared with the end-to-end system
rayon = "1"
rustc-hash = "2.1"
