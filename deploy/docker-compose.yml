# catspace service stack (Kaveh 2026-07-25): self-healing local service --
# vector DB + served engine + web front + observability (MLflow / Prometheus / Grafana).
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  engine:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../data/derived:/app/data/derived:ro
      - ../data/engines:/app/data/engines:ro
      - ../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    ports: ["8777:8777"]

  banksync:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: on-failure
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../data/derived:/app/data/derived:ro
      - ../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    command: >
      python -c "import sys; sys.path.insert(0,'.');
      from catspace.vectordb import sync_banks;
      print(sync_banks('data/derived/sep/lichess_mc2.pt',
                       'artifacts/experiments/assistant'))"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - weblogs:/var/log/nginx
    depends_on: [engine]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000
    volumes: ["../mlflow.db:/mlflow/mlflow.db"]
    ports: ["5001:5000"]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  qdrant_data:
  weblogs:
