# catspace service stack (Kaveh 2026-07-25): self-healing local service --
# vector DB + served engine + web front with usage logging.
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  engine:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../data/derived:/app/data/derived:ro
      - ../data/engines:/app/data/engines:ro
      - ../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    ports: ["8777:8777"]

  banksync:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: on-failure
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../data/derived:/app/data/derived:ro
      - ../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    command: >
      python -c "import sys; sys.path.insert(0,'.');
      from catspace.vectordb import sync_banks;
      print(sync_banks('data/derived/sep/lichess_mc2.pt',
                       'artifacts/experiments/assistant'))"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - weblogs:/var/log/nginx
    depends_on: [engine]

volumes:
  qdrant_data:
  weblogs:
