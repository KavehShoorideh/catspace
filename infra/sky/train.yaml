# catspace training job on cloud CUDA -- one YAML, any vendor.
#   sky launch -c catspace-train infra/sky/train.yaml --env TRAIN_ARGS="--steps 20000 ..."
resources:
  any_of:
    - {cloud: lambda, accelerators: A100:1}
    - {cloud: aws, accelerators: A10G:1}
    - {cloud: gcp, accelerators: A100:1}
    - {cloud: runpod, accelerators: A100:1}
envs:
  DATA_URI: ""            # s3://<bucket>/data
  MODEL_URI: ""           # s3://<bucket>/models
  S3_ENDPOINT: ""
  TRAIN_ARGS: "--games 4000 --sf-only --n-piecedown 45906 --steps 20000 --out artifacts/experiments/cloud_run"
run: |
  docker run --rm --gpus all \
    -e DATA_URI -e MODEL_URI -e S3_ENDPOINT -e TRAIN_ARGS \
    -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
    ${IMAGE:-ghcr.io/OWNER/catspace-train:latest}
