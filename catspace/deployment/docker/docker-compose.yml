# catspace service stack (Kaveh 2026-07-25): self-healing local service --
# vector DB + served engine + web front + observability (MLflow / Prometheus / Grafana).
#
# This file moved from deploy/ to catspace/deployment/docker/ in the 2026-08-03
# restructure, so every relative path is now three levels up to the repo root. Host paths
# mirror the layout the path registry (catspace/io/paths.py) resolves inside the
# container, where /app holds pyproject.toml and is therefore REPO_ROOT.
#
#   docker compose -f catspace/deployment/docker/docker-compose.yml up

# Without this the project name defaults to the containing directory -- "docker".
name: catspace

x-engine-build: &engine-build
  context: ../../..
  dockerfile: catspace/deployment/docker/Dockerfile

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  engine:
    build: *engine-build
    restart: unless-stopped
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../../../data/derived:/app/data/derived:ro
      - ../../../assets/engines:/app/assets/engines:ro
      - ../../../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    ports: ["8777:8777"]

  banksync:
    build: *engine-build
    restart: on-failure
    environment: [QDRANT_URL=http://qdrant:6333]
    volumes:
      - ../../../data/derived:/app/data/derived:ro
      - ../../../artifacts/experiments:/app/artifacts/experiments
    depends_on:
      qdrant: { condition: service_healthy }
    # Was an inline `python -c` with a sys.path.insert and two literal repo-relative
    # paths; it is now a real entrypoint that reads the same registry the engine does.
    command: ["python", "-m", "catspace.deployment.server.banksync"]

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - weblogs:/var/log/nginx
    depends_on: [engine]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000
    # The ONE tracking store, at the repo root -- same file tracking.py writes to.
    volumes: ["../../../mlflow.db:/mlflow/mlflow.db"]
    ports: ["5001:5000"]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  qdrant_data:
  weblogs:
