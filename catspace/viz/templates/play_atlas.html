<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catspace · play-atlas</title>
<link rel="stylesheet" href="/assets/chessground/chessground.base.css">
<link rel="stylesheet" href="/assets/chessground/chessground.brown.css">
<link rel="stylesheet" href="/assets/chessground/chessground.cburnett.css">
<style>
  :root{--bg:#14161a;--panel:#1b1e24;--bd:#2a2e36;--tx:#cfd3da;--mut:#6a7080;
        --blue:#7aa2ff;--grn:#66d9a6;--org:#ffb86b;--pink:#ff7a9c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,sans-serif}
  h1{font-size:15px;margin:0;padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--blue)}
  h1 small{color:var(--mut);font-weight:400}
  .wrap{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .col{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:12px;resize:both;overflow:auto}
  .left{width:470px} .right{flex:1;min-width:540px}
  button{background:#242832;color:var(--tx);border:1px solid var(--bd);border-radius:5px;
         padding:5px 9px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--blue)} button.on{background:var(--blue);color:#0b0d10;border-color:var(--blue)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
  #board{width:432px;height:432px;resize:both;overflow:hidden;max-width:100%}
  .inspect .brd{resize:both;overflow:hidden}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--bd)}
  th{color:var(--mut);font-weight:600}
  .bar{height:8px;background:#2a2e36;border-radius:3px;overflow:hidden;min-width:40px;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--blue)}
  .moves{max-height:96px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;color:var(--mut)}
  .moves b{color:var(--tx)}
  #mapwrap{position:relative}
  #mapbox{resize:both;overflow:hidden;width:700px;height:700px;max-width:100%}
  #map{width:100%;height:100%;background:#101216;border-radius:6px;display:block}
  #tip{position:absolute;pointer-events:none;background:#0d0f13;border:1px solid var(--bd);
       border-radius:6px;padding:4px;display:none;z-index:5}
  .palette{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px}
  .pc{width:38px;height:38px;border:1px solid var(--bd);border-radius:4px;cursor:pointer;
      background-size:contain;background-repeat:no-repeat;background-position:center}
  .pc.on{outline:2px solid var(--org)} .pc.era{display:flex;align-items:center;justify-content:center;font-size:20px}
  .pill{font-size:11px;color:var(--mut)} .k{color:var(--tx)}
  .inspect{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
  .inspect .brd{width:168px;height:168px;flex:none}
  #toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#3a1d24;
         border:1px solid var(--pink);color:#ffd7df;padding:8px 12px;border-radius:6px;display:none}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
  kbd{background:#242832;border:1px solid var(--bd);border-radius:3px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<h1>catspace · play-atlas &nbsp;<small>you play White · engine plays Black · click-drag to move · click a map point to inspect it; hover = stats</small></h1>
<div class="wrap">
  <div class="col left">
    <div class="row">
      <button id="mPlay" class="on">Play</button>
      <button id="mEdit">Edit</button>
      <span style="flex:1"></span>
      <button id="bToy">Toy</button>
      <button id="bNew">New</button>
      <button id="bFlip">Flip</button>
      <button id="bSide">Engine: Black</button>
    </div>
    <div id="board"></div>
    <div class="row" style="margin-top:6px">
      <button id="navFirst" title="start">⏮</button>
      <button id="navPrev" title="back">◀</button>
      <button id="navNext" title="forward">▶</button>
      <button id="navLast" title="latest">⏭</button>
      <button id="bTakeback" title="undo last full move">⟲ Takeback</button>
      <span style="flex:1"></span>
      <button id="bAnalyze" title="run MCTS from here (accumulates); click again to stop &amp; checkpoint">⚙ Analyze</button>
    </div>
    <div id="editbar" class="row" style="display:none;flex-direction:column;align-items:flex-start">
      <div class="palette" id="palette"></div>
      <div class="row" style="margin:6px 0 0">
        <span class="pill">to move:</span>
        <button id="stmW" class="on">White</button><button id="stmB">Black</button>
        <button id="bClear">Clear</button>
        <button id="bCommit">Commit &amp; play</button>
      </div>
    </div>
    <div class="row"><span class="pill" id="status">—</span></div>
    <div class="moves" id="moves"></div>
    <div style="margin-top:10px">
      <div class="pill" style="margin-bottom:4px">engine reasoning
        &nbsp;<span class="k" id="winp">P(win) —</span></div>
      <table id="cand"><thead><tr><th>move</th><th>visits</th><th>value</th><th>P(win)</th></tr></thead>
        <tbody></tbody></table>
      <div class="pill" style="margin-top:6px">best lines</div>
      <div id="lines" class="moves" style="max-height:120px"></div>
    </div>
  </div>

  <div class="col right">
    <div class="row">
      <span class="pill">color:</span>
      <button data-ck="result" class="on">result</button>
      <button data-ck="reach">reach</button>
      <button data-ck="winp">P(win)</button>
      <span style="flex:1"></span>
      <span class="pill" id="legend"></span>
    </div>
    <div id="mapwrap">
      <div id="mapbox"><svg id="map" viewBox="0 0 720 720" preserveAspectRatio="none"></svg></div>
      <div id="tip"></div>
    </div>
    <div class="inspect">
      <div class="brd" id="regionBoard"></div>
      <div>
        <div class="pill">region inspector</div>
        <div class="k" id="regionLabel" style="margin:4px 0">click a map point to inspect</div>
        <div class="row">
          <button id="bLoadRegion">Load →</button>
        </div>
        <div class="pill" style="margin-top:4px">★ on the map = your current board</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { Chessground } from '/assets/chessground/chessground.js';

const GLY={K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const NS="http://www.w3.org/2000/svg";
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const S={fen:START,mode:"play",flip:false,legal:[],atlas:null,proj:null,ck:"result",
        editPiece:"P",stm:"w",region:null,regionIdx:{},
        engineColor:"black",analysis:null,busy:false,analyzing:false,hist:[],ptr:0,
        samplePool:[],sampleIdx:0,pinnedLine:null};
const BRUSH=["green","blue","yellow"];         // top-1/2/3 board arrows
const VCOL={green:"#66d9a6",blue:"#7aa2ff",yellow:"#ffb86b"};
let cg, cgMini;                                 // cgMini = the region-inspector board
const humanColor=()=>S.engineColor==="white"?"black":"white";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(path,body){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json();
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3000);}
function setStatus(t){document.getElementById("status").textContent=t;}
/* gray out every control (optionally keep one enabled, e.g. the Stop button)
   while the engine is thinking or an analysis is running -- prevents Analyze
   from racing the engine's move (the turn-desync bug) and stops double-fires */
function setBusy(on,keepId){document.querySelectorAll("button").forEach(b=>{
  if(keepId&&b.id===keepId){b.disabled=false;b.style.opacity=1;return;}
  b.disabled=on;b.style.opacity=on?0.4:1;});}

/* ---------- chessground board ---------- */
function sideToMove(fen){return fen.split(" ")[1]==="w"?"white":"black";}
function destsMap(){const m=new Map();for(const u of S.legal){const f=u.slice(0,2),t=u.slice(2,4);
  if(!m.has(f))m.set(f,[]);m.get(f).push(t);}return m;}
function cgConfig(extra){const humanTurn=S.mode==="play"&&sideToMove(S.fen)===humanColor();
  return Object.assign({
  fen:S.fen.split(" ")[0], orientation:S.flip?"black":"white", turnColor:sideToMove(S.fen),
  coordinates:true, movable:{free:S.mode==="edit",
    color:S.mode==="edit"?"both":(humanTurn?humanColor():undefined),
    dests:humanTurn?destsMap():new Map(),showDests:true},
  draggable:{showGhost:true}, animation:{enabled:true,duration:120},
  events:{move:onCgMove, select:onCgSelect}, highlight:{lastMove:true,check:true},
},extra||{});}
function initBoard(){cg=Chessground(document.getElementById("board"),cgConfig());
  try{cgMini=Chessground(document.getElementById("regionBoard"),
    {viewOnly:true,coordinates:false,fen:"8/8/8/8/8/8/8/8"});}catch(e){cgMini=null;}
  // redraw both boards when their (resizable) containers change size
  const ro=new ResizeObserver(entries=>{
    for(const e of entries){const w=Math.round(e.contentRect.width); // lock boards SQUARE
      if(w>0 && Math.abs(e.contentRect.height-w)>1) e.target.style.height=w+"px";}
    try{cg.redrawAll();cgMini.redrawAll();}catch(err){}});
  ro.observe(document.getElementById("board"));
  ro.observe(document.getElementById("regionBoard"));}
function miniShow(fen){if(cgMini)cgMini.set({fen:fen.split(" ")[0]});}

let moving=false;   // reentrancy guard: block a 2nd drag mid-apply (the turn-loss
                    // race) WITHOUT calling cg.set() in the move handler (that was
                    // snapping legal moves back to origin)
async function onCgMove(orig,dest){
  if(S.mode==="edit"){S.fen=piecesToFen(cg.state.pieces);return;}
  if(moving||S.busy)return;             // engine thinking / already applying: ignore
  moving=true;
  const uci=S.legal.find(u=>u.slice(0,4)===orig+dest)||(orig+dest);
  try{
    const r=await api("/apply_move",{fen:S.fen,uci});
    if(!r.ok){cg.set(cgConfig());return;}          // only truly-illegal reverts
    S.fen=r.fen; pushHist(r.fen,[orig,dest],r.san,humanColor()==="white");
    await settle([orig,dest]);
  }catch(e){toast(e.message);cg.set(cgConfig());}
  finally{moving=false;}
}
function onCgSelect(key){
  if(S.mode!=="edit")return;
  const p=S.editPiece, pieces=cg.state.pieces;
  if(p===".")pieces.delete(key);
  else pieces.set(key,{role:{K:"king",Q:"queen",R:"rook",B:"bishop",N:"knight",P:"pawn"}[p.toUpperCase()],
                        color:p===p.toUpperCase()?"white":"black"});
  cg.setPieces(pieces); S.fen=piecesToFen(pieces);
}

/* the driver: sync the board, then either the engine moves or the human does */
async function settle(lastMove){
  if(S.busy)return; S.busy=true; setBusy(true);       // engine thinking: gray all
  try{
    let g=await place(S.fen,lastMove);               // sets pieces, S.legal, S.proj
    if(g){drawMap();setStatus("game over · "+g);return;}
    if(sideToMove(S.fen)===S.engineColor){
      setStatus(`engine (${S.engineColor}) thinking…`);
      await sleep(120);
      const r=await api("/engine_move",{fen:S.fen});
      S.analysis=r; renderReason(r); drawArrows(r.candidates); drawMap();
      if(r.move){S.fen=r.fen;
        pushHist(r.fen,[r.move.slice(0,2),r.move.slice(2,4)],r.san,S.engineColor==="white");}
      g=await place(S.fen,r.move?[r.move.slice(0,2),r.move.slice(2,4)]:null);
      if(cg)cg.setShapes([]); drawMap();             // clear the engine's pre-move arrows
      setStatus(g?("game over · "+g):`your move (${humanColor()})`);
    }else{                                            // human to move: STATIC, no auto-analysis
      setStatus(`your move (${humanColor()}) · ⚙ Analyze for the engine's read`);
    }
  }catch(e){toast(e.message);}finally{S.busy=false;setBusy(false);}
}
async function showHint(){                            // top-3 for the side to move
  try{const a=await api("/analyze",{fen:S.fen});S.analysis=a;
    renderReason({winp:a.winp,candidates:a.candidates,pv:[]});
    drawArrows(a.candidates);drawMap();
    setStatus(a.game_over?("game over · "+a.result):`your move (${humanColor()})`);
  }catch(e){/* ignore */}
}

/* place pieces + set turn/dests; returns "white"/"black"/"draw" if terminal else null */
async function place(fen,lastMove){S.fen=fen;let over=null;
  try{const r=await api("/set_board",{fen});S.legal=r.legal_moves||[];S.proj=r;
    if(r.game_over)over=r.result||"draw";}catch(e){}
  cg.set(cgConfig({fen:fen.split(" ")[0],lastMove:lastMove||undefined,turnColor:sideToMove(fen)}));
  return over;
}

/* top-3 move arrows on the board (chessground shapes) */
function drawArrows(cands){if(!cg)return;
  const sh=(cands||[]).slice(0,3).map((c,i)=>({orig:c.uci.slice(0,2),dest:c.uci.slice(2,4),brush:BRUSH[i]}));
  cg.setShapes(sh);}

/* ---------- fen <-> chessground pieces ---------- */
const FILE="abcdefgh";
function piecesToFen(pieces){
  const g=Array.from({length:8},()=>Array(8).fill(""));
  const L={king:"k",queen:"q",rook:"r",bishop:"b",knight:"n",pawn:"p"};
  for(const [sq,pc] of pieces){const c=FILE.indexOf(sq[0]),r=8-(+sq[1]);
    let ch=L[pc.role]; if(pc.color==="white")ch=ch.toUpperCase(); g[r][c]=ch;}
  const rows=g.map(line=>{let s="",e=0;for(const p of line){if(!p)e++;else{if(e){s+=e;e=0;}s+=p;}}if(e)s+=e;return s;});
  return rows.join("/")+" "+S.stm+" - - 0 1";
}
function fenGrid(fen){const rows=fen.split(" ")[0].split("/");return rows.map(r=>{
  const line=[];for(const ch of r){if(/\d/.test(ch))for(let i=0;i<+ch;i++)line.push("");else line.push(ch);}return line;});}

/* ---------- move history + reasoning ---------- */
function pushHist(fen,lastMove,san,white){
  if(S.ptr<S.hist.length-1)S.hist=S.hist.slice(0,S.ptr+1);   // branch: drop redo
  S.hist.push({fen,lastMove:lastMove||null,san:san||null,white});
  S.ptr=S.hist.length-1; rebuildMoves();
}
function rebuildMoves(){const m=document.getElementById("moves");m.innerHTML="";let n=0;
  for(let i=1;i<S.hist.length;i++){const h=S.hist[i];const cur=i===S.ptr?' style="background:#2a2e36"':'';
    if(h.white){n++;m.innerHTML+=`<span data-i="${i}"${cur}>${n}. <b>${h.san}</b> </span>`;}
    else m.innerHTML+=`<span data-i="${i}"${cur}><b>${h.san}</b> </span>`;}
  m.querySelectorAll("[data-i]").forEach(s=>{s.style.cursor="pointer";s.onclick=()=>goto(+s.dataset.i);});
  m.scrollTop=m.scrollHeight;}
function renderReason(r){
  if(S.pinnedLine!=null && S.pinnedLine>=(r.candidates||[]).length) S.pinnedLine=null; // keep a valid pin across re-renders
  document.getElementById("winp").textContent="P(win) "+(r.winp!=null?r.winp.toFixed(3):"—")
    +(r.nodes?` · ${r.nodes}n`:"");
  const tb=document.querySelector("#cand tbody");tb.innerHTML="";
  const mx=Math.max(1,...(r.candidates||[]).map(c=>c.visits));
  (r.candidates||[]).forEach((c,i)=>{const tr=document.createElement("tr");
    tr.innerHTML=`<td><span style="color:${VCOL[BRUSH[i]]||'#cfd3da'}">●</span> ${c.san}</td>`+
      `<td><span class="bar"><i style="width:${100*c.visits/mx}%"></i></span> ${c.visits}</td>`+
      `<td>${c.value.toFixed(2)}</td><td>${c.winp.toFixed(2)}</td>`;tb.appendChild(tr);});
  const L=document.getElementById("lines");L.innerHTML="";
  (r.candidates||[]).slice(0,3).forEach((c,i)=>{const col=VCOL[BRUSH[i]]||"#cfd3da";
    const plies=(c.hops||[]).map((h,j)=>`<span class="ply" data-ci="${i}" data-hop="${j}">${h.san}</span>`).join(" ")||(c.san||"");
    L.innerHTML+=`<div class="lrow" data-ci="${i}"><span style="color:${col}">●</span> ${plies}</div>`;});
  L.querySelectorAll(".lrow").forEach(row=>{const ci=+row.dataset.ci;row.style.cursor="pointer";
    row.title="click: pin/unpin this line's hops on the map";
    row.onclick=()=>{S.pinnedLine=(S.pinnedLine===ci?null:ci);drawMap();};});
  L.querySelectorAll(".ply").forEach(s=>{s.style.cursor="pointer";
    s.title="click: pin this position's board";
    s.onclick=(ev)=>{ev.stopPropagation();
      const c=(S.analysis&&S.analysis.candidates||[])[+s.dataset.ci];
      const h=c&&c.hops&&c.hops[+s.dataset.hop];
      if(h)showInspect(h.fen,`${h.white?"White":"Black"} plays ${h.san}`);};});
}
/* the PV as a path of sequential HOPS through the embedding map (W light /
   B dark dots), drawn on hover over a best-line */
function drawHops(cand,ci){const svg=document.getElementById("map");
  if(!svg||!cand.hops||!cand.hops.length||!S.proj||!S.mapX)return;
  const X=S.mapX,Y=S.mapY,col=VCOL[BRUSH[ci]]||"#7aa2ff";
  const pts=[[S.proj.x,S.proj.y]].concat(cand.hops.map(h=>[h.x,h.y]));
  const pl=document.createElementNS(NS,"polyline");
  pl.setAttribute("points",pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(" "));
  pl.setAttribute("fill","none");pl.setAttribute("stroke",col);pl.setAttribute("stroke-width",2.6);
  pl.setAttribute("opacity",.95);pl.setAttribute("pointer-events","none");svg.appendChild(pl);
  cand.hops.forEach((h,j)=>{const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",X(h.x));c.setAttribute("cy",Y(h.y));c.setAttribute("r",6);
    c.setAttribute("fill",h.white?"#eef1f7":"#20242c");c.setAttribute("stroke",col);
    c.setAttribute("stroke-width",2);c.setAttribute("pointer-events","none");svg.appendChild(c);
    const t=document.createElementNS(NS,"text");t.setAttribute("x",X(h.x)+8);t.setAttribute("y",Y(h.y)-5);
    t.setAttribute("fill",col);t.setAttribute("font-size","11");t.setAttribute("stroke","#0b0d10");
    t.setAttribute("stroke-width",".4");t.setAttribute("pointer-events","none");
    t.textContent=`${j+1}.${h.san}`;svg.appendChild(t);});}
function previewHop(h){miniShow(h.fen);
  document.getElementById("regionLabel").textContent=`${h.white?"White":"Black"} plays ${h.san}`;}
async function goto(i){if(i<0||i>=S.hist.length)return;S.ptr=i;const h=S.hist[i];
  S.fen=h.fen;S.analysis=null;if(cg)cg.setShapes([]);rebuildMoves();
  const tip=(i===S.hist.length-1);
  await place(S.fen,h.lastMove);
  if(!tip){cg.set({movable:{color:undefined,dests:new Map()}});
    setStatus(`browsing ${i}/${S.hist.length-1} — ⏭ to resume, Takeback to branch`);}
  else if(S.mode==="play"){await showHint();}
  drawMap();}
async function takeback(){if(S.hist.length<=1)return;
  let t=S.hist.length-2;                                     // drop the last ply…
  while(t>0 && sideToMove(S.hist[t].fen)!==humanColor())t--; // …land on human-to-move
  S.hist=S.hist.slice(0,t+1);S.ptr=t;await goto(t);}
/* Analyze is a START/STOP toggle: pressing it runs a CHUNKED extend loop
   (+800 nodes/chunk, accumulating on the server's cached tree) and turns into
   a Stop button; every other control grays out. Stop halts the loop -- the
   server tree is the checkpoint, so pressing Analyze again on the same
   position RESUMES (extends) from where it left off. */
async function analyzeHere(){
  const btn=document.getElementById("bAnalyze");
  if(S.analyzing){S.analyzing=false;return;}          // Stop clicked: loop will exit
  if(S.busy){toast("wait for the engine");return;}    // never race the engine's move
  S.analyzing=true; S.busy=true; setBusy(true,"bAnalyze"); btn.textContent="⏹ Stop";
  const fen=S.fen;                                     // pin the analysed position
  try{
    while(S.analyzing){
      const a=await api("/analyze",{fen,topk:3,nodes:800,extend:true});
      if(!S.analyzing)break;                            // stopped during the fetch
      S.analysis=a; renderReason(a); drawArrows(a.candidates); drawMap();
      setStatus(`analyzing… ${a.nodes}n  (⏹ to stop)`);
      if(a.game_over)break;
      await sleep(0);                                   // let a Stop click register
    }
    setStatus(`analysis paused @${S.analysis?S.analysis.nodes:0}n · ⚙ to resume`);
  }catch(e){toast(e.message);}
  finally{S.analyzing=false; S.busy=false; btn.textContent="⚙ Analyze"; setBusy(false);}
}

/* ---------- t-SNE map ---------- */
function ex(v){const a=Math.min(...v),b=Math.max(...v);return[a,b-a||1];}
function colorFor(pt){if(S.ck==="result")return pt.result>0?"#66d9a6":pt.result<0?"#ff7a9c":"#8a90a0";
  const v=S.ck==="reach"?pt._rn:pt.winp;return `hsl(${(1-v)*220},70%,60%)`;}
function miniBoard(fen,px){const g=fenGrid(fen);const S2=px||160,q=S2/8;
  let s=`<svg viewBox="0 0 ${S2} ${S2}" width="${S2}" height="${S2}">`;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const x=c*q,y=r*q,d=(r+c)%2;
    s+=`<rect x="${x}" y="${y}" width="${q}" height="${q}" fill="${d?"#6b7688":"#b9c2d0"}"/>`;
    const p=g[r][c];if(p)s+=`<text x="${x+q/2}" y="${y+q*0.72}" font-size="${q*0.8}" text-anchor="middle" `+
      `fill="${p===p.toUpperCase()?"#fff":"#111"}">${GLY[p]}</text>`;}
  return s+"</svg>";}
function drawMap(){
  const A=S.atlas;if(!A)return;const svg=document.getElementById("map");svg.innerHTML="";
  const P=A.points;const[bx,wx]=ex(P.map(p=>p.x)),[by,wy]=ex(P.map(p=>p.y));
  const pad=30,W=720-2*pad;const rmin=Math.min(...P.map(p=>p.reach)),rmax=Math.max(...P.map(p=>p.reach));
  const X=x=>pad+(x-bx)/wx*W,Y=y=>720-pad-(y-by)/wy*W;
  S.mapX=X;S.mapY=Y;S._inv=(px,py)=>[(px-pad)/W*wx+bx,(720-pad-py)/W*wy+by];
  const bg=document.createElementNS(NS,"rect");bg.setAttribute("width",720);bg.setAttribute("height",720);
  bg.setAttribute("fill","transparent");
  bg.addEventListener("mousemove",ev=>{const[x,y]=svgInv(ev,svg);showClusterTip(ev,nearestCluster(x,y));});
  bg.addEventListener("mouseleave",hideTip);
  bg.addEventListener("click",hideTip);
  svg.appendChild(bg);
  P.forEach(p=>{p._rn=(p.reach-rmin)/((rmax-rmin)||1);const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",X(p.x));c.setAttribute("cy",Y(p.y));c.setAttribute("r",3.4);
    c.setAttribute("fill",colorFor(p));c.setAttribute("opacity",.72);c.style.cursor="pointer";
    c.addEventListener("mousemove",ev=>{ev.stopPropagation();showPointTip(ev,p);});
    c.addEventListener("mouseleave",hideTip);
    c.addEventListener("click",ev=>{ev.stopPropagation();
      showInspect(p.fen,`${p.result>0?"White won":p.result<0?"Black won":"draw"} · ply ${p.ply} · P(win) ${p.winp}`);});
    svg.appendChild(c);});
  // overlay: a PINNED best-line's hop-path, else the top-3 move vectors
  if(S.pinnedLine!=null&&S.analysis&&S.analysis.candidates&&S.analysis.candidates[S.pinnedLine])
    drawHops(S.analysis.candidates[S.pinnedLine],S.pinnedLine);
  else if(S.proj&&S.analysis&&S.analysis.candidates){
    (S.analysis.candidates).slice(0,3).forEach((c,i)=>{
      if(c.x==null)return;const col=VCOL[BRUSH[i]];
      const ln=document.createElementNS(NS,"line");ln.setAttribute("x1",X(S.proj.x));
      ln.setAttribute("y1",Y(S.proj.y));ln.setAttribute("x2",X(c.x));ln.setAttribute("y2",Y(c.y));
      ln.setAttribute("stroke",col);ln.setAttribute("stroke-width",2.2);ln.setAttribute("opacity",.9);
      ln.setAttribute("pointer-events","none");svg.appendChild(ln);
      const dot=document.createElementNS(NS,"circle");dot.setAttribute("cx",X(c.x));
      dot.setAttribute("cy",Y(c.y));dot.setAttribute("r",5);dot.setAttribute("fill",col);
      dot.setAttribute("stroke","#0b0d10");dot.setAttribute("pointer-events","none");svg.appendChild(dot);
      const tx=document.createElementNS(NS,"text");tx.setAttribute("x",X(c.x));tx.setAttribute("y",Y(c.y)-8);
      tx.setAttribute("fill",col);tx.setAttribute("font-size","11");tx.setAttribute("text-anchor","middle");
      tx.setAttribute("pointer-events","none");tx.textContent=c.san;svg.appendChild(tx);});}
  if(S.proj){const s=document.createElementNS(NS,"text");s.setAttribute("x",X(S.proj.x));
    s.setAttribute("y",Y(S.proj.y)+8);s.setAttribute("font-size","28");s.setAttribute("text-anchor","middle");
    s.setAttribute("fill","#ffe08a");s.setAttribute("stroke","#000");s.setAttribute("stroke-width",".7");
    s.setAttribute("pointer-events","none");s.textContent="★";svg.appendChild(s);}
  drawLegend();
}
function svgInv(ev,svg){const r=svg.getBoundingClientRect();
  return S._inv((ev.clientX-r.left)/r.width*720,(ev.clientY-r.top)/r.height*720);}
function nearestCluster(x,y){let best=null,bd=1e18;for(const c of S.atlas.clusters){
  const d=(c.cx-x)**2+(c.cy-y)**2;if(d<bd){bd=d;best=c;}}return best;}
/* HOVER = statistics only (light tooltip); CLICK pins the board in the fixed
   inspector so you can hover away and it stays (Kaveh) */
function tipHTML(ev,html){const tip=document.getElementById("tip");
  tip.innerHTML=`<div class="pill" style="white-space:nowrap;color:var(--tx)">${html}</div>`;
  const wrap=document.getElementById("mapwrap"),r=wrap.getBoundingClientRect();
  tip.style.display="block";tip.style.left=Math.min(ev.clientX-r.left+12,r.width-180)+"px";
  tip.style.top=Math.min(ev.clientY-r.top+12,r.height-34)+"px";}
function showPointTip(ev,p){tipHTML(ev,`${p.result>0?"White won":p.result<0?"Black won":"draw"} · ply ${p.ply} · P(win) ${p.winp} · reach ${p.reach}`);}
function showClusterTip(ev,cl){if(cl)tipHTML(ev,`${cl.label} · ${cl.n} positions — click to sample here`);}
function hideTip(){document.getElementById("tip").style.display="none";}
function drawLegend(){const l=document.getElementById("legend");
  if(S.ck==="result")l.innerHTML='<span class="swatch" style="background:#66d9a6"></span>W '+
    '<span class="swatch" style="background:#ff7a9c"></span>B <span class="swatch" style="background:#8a90a0"></span>draw';
  else l.textContent=S.ck+": blue low → red high";}

/* ---------- region inspector: a pinned sample pool over ALL points ---------- */
function showInspect(fen,label){S._regionFen=fen;
  document.getElementById("regionLabel").textContent=label||"";miniShow(fen);}
document.getElementById("bLoadRegion").onclick=()=>{if(S._regionFen)loadFen(S._regionFen);};

/* ---------- load a fen ---------- */
async function loadFen(fen){try{const r=await api("/set_board",{fen});if(!r.valid){toast("invalid position");return;}
  S.fen=fen;S.legal=r.legal_moves||[];S.proj=r;S.analysis=null;
  S.hist=[{fen,lastMove:null,san:null,white:null}];S.ptr=0;rebuildMoves();
  document.querySelector("#cand tbody").innerHTML="";document.getElementById("lines").innerHTML="";
  if(cg)cg.setShapes([]);
  await settle(null);                                // engine moves if it's its turn
}catch(e){toast(e.message);}}

/* ---------- edit palette ---------- */
function pieceBg(p){const role={K:"king",Q:"queen",R:"rook",B:"bishop",N:"knight",P:"pawn"}[p.toUpperCase()];
  const col=p===p.toUpperCase()?"white":"black";return `background-image:var(--cg-${col}-${role},none)`;}
function buildPalette(){const pal=document.getElementById("palette");pal.innerHTML="";
  for(const p of ["K","Q","R","B","N","P","k","q","r","b","n","p","."]){
    const d=document.createElement("div");d.className="pc"+(p===S.editPiece?" on":"")+(p==="."?" era":"");
    if(p===".")d.textContent="⌫"; else d.innerHTML=`<span style="display:block;width:100%;height:100%">${miniPiece(p)}</span>`;
    d.onclick=()=>{S.editPiece=p;buildPalette();};pal.appendChild(d);}}
function miniPiece(p){return `<svg viewBox="0 0 40 40" width="38" height="38"><text x="20" y="30" font-size="30" text-anchor="middle" fill="${p===p.toUpperCase()?'#eee':'#111'}" stroke="${p===p.toUpperCase()?'#000':'#888'}" stroke-width=".5">${GLY[p]}</text></svg>`;}

/* ---------- controls ---------- */
function setMode(m){S.mode=m;
  document.getElementById("mPlay").classList.toggle("on",m==="play");
  document.getElementById("mEdit").classList.toggle("on",m==="edit");
  document.getElementById("editbar").style.display=m==="edit"?"flex":"none";
  if(m==="edit"){buildPalette();cg.setShapes([]);cg.set(cgConfig());}
  else settle(null);}
document.getElementById("mPlay").onclick=()=>setMode("play");
document.getElementById("mEdit").onclick=()=>setMode("edit");
document.getElementById("bCommit").onclick=()=>setMode("play");
document.getElementById("bSide").onclick=()=>{S.engineColor=S.engineColor==="white"?"black":"white";
  document.getElementById("bSide").textContent="Engine: "+(S.engineColor==="white"?"White":"Black");
  if(S.mode==="play")settle(null);};
document.getElementById("bClear").onclick=()=>{cg.set({fen:"8/8/8/8/8/8/8/8"});S.fen="8/8/8/8/8/8/8/8 "+S.stm+" - - 0 1";};
document.getElementById("stmW").onclick=()=>{S.stm="w";S.fen=piecesToFen(cg.state.pieces);
  document.getElementById("stmW").classList.add("on");document.getElementById("stmB").classList.remove("on");};
document.getElementById("stmB").onclick=()=>{S.stm="b";S.fen=piecesToFen(cg.state.pieces);
  document.getElementById("stmB").classList.add("on");document.getElementById("stmW").classList.remove("on");};
document.getElementById("bFlip").onclick=()=>{S.flip=!S.flip;cg.set({orientation:S.flip?"black":"white"});};
document.getElementById("navFirst").onclick=()=>goto(0);
document.getElementById("navPrev").onclick=()=>goto(S.ptr-1);
document.getElementById("navNext").onclick=()=>goto(S.ptr+1);
document.getElementById("navLast").onclick=()=>goto(S.hist.length-1);
document.getElementById("bTakeback").onclick=takeback;
document.getElementById("bAnalyze").onclick=()=>analyzeHere();
window.addEventListener("keydown",e=>{if(/input|textarea/i.test(e.target.tagName))return;
  if(e.key==="ArrowLeft")goto(S.ptr-1);else if(e.key==="ArrowRight")goto(S.ptr+1);});
document.getElementById("bNew").onclick=()=>loadFen(START);
document.getElementById("bToy").onclick=async()=>{const t=await api("/toy");loadFen(t.fen);};
document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{S.ck=b.dataset.ck;
  document.querySelectorAll("[data-ck]").forEach(x=>x.classList.toggle("on",x===b));drawMap();});

/* ---------- boot ---------- */
(async function(){
  initBoard();
  try{S.atlas=await api("/atlas");}catch(e){toast("atlas not built — run build_play_atlas.py");}
  await loadFen(S.fen);
})();
</script>
</body>
</html>
