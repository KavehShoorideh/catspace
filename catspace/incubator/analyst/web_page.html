<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catspace · analyst</title>
<link rel="stylesheet" href="/assets/chessground/chessground.base.css">
<link rel="stylesheet" href="/assets/chessground/chessground.brown.css">
<link rel="stylesheet" href="/assets/chessground/chessground.cburnett.css">
<style>
  /* the play-atlas skin (Kaveh 2026-09-05: reuse the board and the streaming UX that already worked) */
  :root{--bg:#14161a;--panel:#1b1e24;--bd:#2a2e36;--tx:#cfd3da;--mut:#6a7080;
        --blue:#7aa2ff;--grn:#66d9a6;--org:#ffb86b;--pink:#ff7a9c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,sans-serif}
  h1{font-size:15px;margin:0;padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--blue);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1 small{color:var(--mut);font-weight:400}
  h1 form{display:flex;gap:6px;flex:1;min-width:280px;max-width:640px}
  h1 input{flex:1;background:#0d0f13;color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font:12px ui-monospace,monospace}
  .wrap{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .col{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto}
  /* game view: board on top, controls, then the analysis, then the moves; the game/player info sits BESIDE the
     board on a wide screen and folds into one strip above it on a phone (Kaveh 2026-09-05: board + text in one view) */
  .gv{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;max-width:1200px}
  @media (min-width:900px){.gv{grid-template-columns:230px minmax(440px,640px) minmax(260px,1fr);padding:14px;gap:14px}
    .gv .info{grid-column:1} .gv .mainc{grid-column:2} .gv .extra{grid-column:3}}
  .gv .extra{font-size:12.5px}
  .info{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
  .players{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
  .players .name{font-weight:600;color:var(--tx)} .players .elo{color:var(--mut)}
  .players .vs{color:var(--mut)}
  @media (min-width:900px){.players{flex-direction:column;align-items:flex-start;gap:4px}}
  .meta{color:var(--mut);font-size:12px;margin-top:4px;line-height:1.5}
  #board{width:100%;aspect-ratio:1;max-width:100%;touch-action:none}
  .mainc{min-width:0}
  .mainc .col{padding:10px}
  .analysis{margin-top:8px}
  button{background:#242832;color:var(--tx);border:1px solid var(--bd);border-radius:5px;
         padding:5px 9px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--blue)} button.on{background:var(--blue);color:#0b0d10;border-color:var(--blue)}
  button.flag{border-color:var(--pink);color:var(--pink)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
  #board{width:432px;height:432px;resize:both;overflow:hidden;max-width:100%}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--bd)}
  th{color:var(--mut);font-weight:600}
  tr.link{cursor:pointer} tr.link:hover td{background:#242832}
  .bar{height:8px;background:#2a2e36;border-radius:3px;overflow:hidden;min-width:40px;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--blue)} .bar.g>i{background:var(--grn)}
  .moves{position:relative;max-height:200px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);line-height:1.8;margin-top:8px}
  .moves b{color:var(--tx)}
  .moves span{padding:0 3px;border-radius:3px;cursor:pointer}
  .moves span.inaccuracy b{color:var(--org)} .moves span.mistake b{color:var(--pink)} .moves span.blunder b{color:var(--pink);text-decoration:underline}
  .moves span.cur{background:#2a2e36;outline:1px solid var(--blue)}
  .pill{font-size:11px;color:var(--mut)} .k{color:var(--tx)}
  .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:#242832}
  .tag.best,.tag.ok{color:var(--grn)} .tag.inaccuracy{color:var(--org)} .tag.mistake,.tag.blunder{color:var(--pink)}
  .head{font-size:15px;line-height:1.35;margin:6px 0 8px;color:var(--tx)}
  .box{background:#0d0f13;border:1px solid var(--bd);border-radius:6px;padding:10px 12px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:var(--tx);max-height:40vh;overflow:auto}
  .lrow{margin:3px 0} .ply{cursor:pointer;padding:0 2px;border-radius:3px} .ply:hover{background:#2a2e36}
  .ladder td{padding:2px 4px;white-space:nowrap}
  #toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#3a1d24;
         border:1px solid var(--pink);color:#ffd7df;padding:8px 12px;border-radius:6px;display:none;z-index:9}
  #toast.ok{background:#1d3a2a;border-color:var(--grn);color:#d7ffe6}
  kbd{background:#242832;border:1px solid var(--bd);border-radius:3px;padding:0 4px;font-size:11px}
  .prog{height:6px;background:#2a2e36;border-radius:3px;overflow:hidden;margin:6px 0} .prog>i{display:block;height:100%;background:var(--blue);transition:width .3s}
  #flagbtn{position:fixed;right:14px;bottom:14px;z-index:8;box-shadow:0 2px 12px rgba(0,0,0,.5)}
  dialog{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:14px;max-width:560px;width:calc(100vw - 40px)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog textarea{width:100%;min-height:80px;background:#0d0f13;color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:6px;font:13px system-ui,sans-serif}
  dialog .ctx{font:11px/1.4 ui-monospace,monospace;color:var(--mut);max-height:140px;overflow:auto;white-space:pre-wrap;margin:6px 0}
  .home{max-width:70ch;padding:14px;line-height:1.55}
  .chip{display:inline-block;padding:3px 9px;border:1px solid var(--bd);border-radius:12px;margin:3px 4px 0 0;cursor:pointer;background:#242832}
  a{color:var(--blue)}
  .summary{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:#0d0f13;border:1px solid var(--bd);border-radius:6px;padding:10px;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<h1><span id="home" style="cursor:pointer">catspace · analyst</span>
  <form id="form"><input id="q" placeholder="Lichess game link, game id, or user name" autocomplete="off" spellcheck="false"><button class="on" type="submit">Analyse</button></form>
  <small id="hstatus"></small></h1>
<div id="main"></div>
<button id="flagbtn" class="flag" title="log what you are looking at for review">⚑ Something is not right</button>
<dialog id="flagdlg">
  <form method="dialog" id="flagform">
    <div class="pill">Something is not right</div>
    <p style="margin:6px 0 4px">What is wrong here? (optional)</p>
    <textarea id="note" placeholder="e.g. the knight is not pinned, the rook is protected"></textarea>
    <div class="pill" style="margin-top:6px">what will be logged</div>
    <div class="ctx" id="ctx"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="on" type="submit">Log it</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script type="module">
import { Chessground } from '/assets/chessground/chessground.js';
import { Chess } from '/assets/chessjs.js';

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ERR=new Set(["inaccuracy","mistake","blunder"]);
const BRUSH_PLAYED="yellow", BRUSH_BEST="green", BRUSH_REPLY="red";
let cg=null, poll=null;
/* S.plies = the server's analysis frames (one per ply, may be partial while streaming);
   S.fens[i] = the position BEFORE ply i (fens[n] = the final position); S.ptr = the ply being explained. */
const S={view:"home",gameId:null,headers:{},plies:[],fens:[],moves:[],ptr:0,flip:false,total:0,partial:false,side:null,probe:null,userName:null};

function toast(m,ok){const t=$("#toast");t.textContent=m;t.className=ok?"ok":"";t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3200);}
function setStatus(t){const s=$("#status");if(s)s.textContent=t;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function api(path,body){const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;}
function stopPoll(){if(poll){clearInterval(poll);poll=null;}}
function recent(){try{return JSON.parse(localStorage.getItem("analyst-recent")||"[]");}catch(e){return[];}}
function remember(kind,key,label){try{const r=recent().filter(x=>x.key!==key);r.unshift({kind,key,label});localStorage.setItem("analyst-recent",JSON.stringify(r.slice(0,12)));}catch(e){}}

/* ---------- routing ---------- */
function go(h){location.hash=h;}
window.addEventListener("hashchange",route);
$("#home").onclick=()=>go("");
$("#form").addEventListener("submit",async e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;
  try{const r=await api("/api/resolve",{input:q});$("#q").value="";go(r.kind==="game"?"game/"+r.key:"user/"+encodeURIComponent(r.key));}
  catch(err){toast(err.message);}});
function route(){stopPoll();const h=location.hash.slice(1);
  if(h.startsWith("game/")){const [gid,p]=h.slice(5).split("@");openGame(gid,p==null?null:+p);}
  else if(h.startsWith("user/"))openUser(decodeURIComponent(h.slice(5)));
  else home();}

/* ---------- home ---------- */
async function home(){S.view="home";cg=null;
  const r=recent();
  $("#main").innerHTML=`<div class="home">
    <p>Paste a Lichess game link: the game is fetched and analysed move by move, both sides, and you step through it with the analysis beside the board. Paste a user name: their recent games are reviewed; every error opens the game at that move.</p>
    <p class="pill">Everything runs on this machine (Stockfish, the Maia ladder, the cache). Lichess is only asked for the PGN. <kbd>←</kbd> <kbd>→</kbd> step moves.</p>
    <div class="pill" style="margin-top:12px">recent</div><div id="recent">${r.map(x=>`<span class="chip" data-kind="${x.kind}" data-key="${esc(x.key)}">${esc(x.label||x.key)}</span>`).join("")||'<span class="pill">nothing yet</span>'}</div>
    <div class="pill" style="margin-top:12px">flags</div><div id="flagcount" class="pill">…</div></div>`;
  $("#main").querySelectorAll(".chip").forEach(c=>c.onclick=()=>go(c.dataset.kind==="game"?"game/"+c.dataset.key:"user/"+encodeURIComponent(c.dataset.key)));
  try{const f=await api("/api/flags");$("#flagcount").textContent=f.length?`${f.length} logged in feedback/flags.jsonl (last #${f[f.length-1].id}, ${f[f.length-1].time})`:"none logged yet";}catch(e){}
}

/* ---------- game view ---------- */
function gameLayout(){
  $("#main").innerHTML=`<div class="gv">
  <div class="info">
    <div class="players" id="players"><span class="name">—</span></div>
    <div class="meta" id="meta"></div>
    <div class="row" style="margin:8px 0 0"><button id="bFlip">Flip</button><a id="lichess" href="#" target="_blank" rel="noopener" class="pill">lichess ↗</a></div>
  </div>
  <div class="mainc">
    <div id="board"></div>
    <div class="row" style="margin:6px 0">
      <button id="navFirst" title="start">⏮</button><button id="navPrev" title="back">◀</button>
      <button id="navNext" title="forward">▶</button><button id="navLast" title="end">⏭</button>
      <span class="pill" id="status" style="flex:1">—</span>
      <button class="flag" id="flagMove" title="log this move's analysis for review">⚑</button></div>
    <div class="prog" id="prog" style="display:none"><i style="width:0%"></i></div>
    <div class="col analysis">
      <div id="verdict"></div>
      <div class="head" id="head">—</div>
      <div id="lines"></div>
      <div class="box" id="text">—</div>
      <table class="ladder" id="ladder"><tbody></tbody></table>
    </div>
    <div class="moves" id="moves"></div>
    <details style="margin-top:8px"><summary class="pill" style="cursor:pointer">every fact (long form)</summary><div class="box" id="textLong" style="margin-top:6px"></div></details>
    <div class="pill" style="margin-top:8px">click a move in a line to see it on the board; a move on the board explores; ◀ ▶ return to the game</div>
  </div>
  <div class="extra info" id="summary"></div></div>`;
  $("#bFlip").onclick=()=>{S.flip=!S.flip;setBoard();};
  $("#navFirst").onclick=()=>goto(0);$("#navPrev").onclick=()=>goto(S.ptr-1);$("#navNext").onclick=()=>goto(S.ptr+1);$("#navLast").onclick=()=>goto(S.moves.length);
  $("#flagMove").onclick=()=>openFlag(flagContext());
  initBoard();
}
function initBoard(){
  cg=Chessground($("#board"),cgConfig());
  const ro=new ResizeObserver(entries=>{for(const e of entries){const w=Math.round(e.contentRect.width);
      if(w>0&&Math.abs(e.contentRect.height-w)>1)e.target.style.height=w+"px";}
    try{cg.redrawAll();}catch(err){}});
  ro.observe($("#board"));
}
/* show a position from a line on the main board (an exploration view; navigation returns to the game) */
function showLinePosition(fen,label){let g;try{g=new Chess(fen);}catch(e){return;}S.probe=g;
  cg.set(cgConfig({lastMove:undefined}));cg.setShapes([]);setStatus(`${label} · ◀ ▶ to return to the game`);}
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
function curFen(){return S.probe?S.probe.fen():(S.fens[S.ptr]||S.fens[0]||START);}
function turnOf(fen){return fen.split(" ")[1]==="w"?"white":"black";}
function legalDests(fen){let g;try{g=new Chess(fen);}catch(e){return new Map();}const m=new Map();
  for(const mv of g.moves({verbose:true})){if(!m.has(mv.from))m.set(mv.from,[]);m.get(mv.from).push(mv.to);}return m;}
function cgConfig(extra){const fen=curFen();
  return Object.assign({fen:fen.split(" ")[0],orientation:S.flip?"black":"white",turnColor:turnOf(fen),coordinates:true,
    movable:{free:false,color:turnOf(fen),dests:legalDests(fen),showDests:true},draggable:{showGhost:true},
    animation:{enabled:true,duration:120},events:{move:onCgMove},highlight:{lastMove:true,check:true}},extra||{});}
/* a move on the board explores from the current position (chess.js, local); nav returns to the game */
function onCgMove(orig,dest){
  const base=S.probe||new Chess(curFen());const cand=base.moves({verbose:true}).find(m=>m.from===orig&&m.to===dest);
  if(!cand){cg.set(cgConfig());return;}
  if(!S.probe)S.probe=base;if(!safeMove(S.probe,{from:orig,to:dest,promotion:cand.promotion})){cg.set(cgConfig());return;}
  cg.set(cgConfig({lastMove:[orig,dest]}));cg.setShapes([]);
  setStatus(`exploring: ${cand.san} · ◀ ▶ to return to the game`);
}
function setBoard(){if(!cg)return;
  const prev=S.ptr>0?S.plies[S.ptr-1]:null;                     // the move that led here is the lastMove highlight
  cg.set(cgConfig({lastMove:prev?[prev.uci.slice(0,2),prev.uci.slice(2,4)]:undefined}));
  drawArrows(S.plies[S.ptr]);                                    // the move about to be played (yellow) and the best (green)
}
function drawArrows(p){if(!cg)return;const sh=[];
  if(p){sh.push({orig:p.uci.slice(0,2),dest:p.uci.slice(2,4),brush:BRUSH_PLAYED});
    if(p.best_uci&&p.best_uci!==p.uci)sh.push({orig:p.best_uci.slice(0,2),dest:p.best_uci.slice(2,4),brush:BRUSH_BEST});}
  cg.setShapes(sh);}
function goto(i){if(!S.moves.length)return;i=Math.max(0,Math.min(i,S.moves.length));S.ptr=i;S.probe=null;
  history.replaceState(null,"","#game/"+S.gameId+"@"+i);
  setBoard();renderMoves();renderPanel();}
window.addEventListener("keydown",e=>{if(/input|textarea/i.test(e.target.tagName)||S.view!=="game")return;
  if(e.key==="ArrowLeft"){e.preventDefault();goto(S.ptr-1);}else if(e.key==="ArrowRight"){e.preventDefault();goto(S.ptr+1);}
  else if(e.key==="Home")goto(0);else if(e.key==="End")goto(S.moves.length);else if(e.key==="f")$("#bFlip").click();});

/* the game's moves come from the PGN (via the first frame's fens); frames fill in as the server streams */
function loadMoves(plies,total,finalFen){
  const g=new Chess();S.fens=[g.fen()];S.moves=[];
  for(const p of plies){const m=safeMove(g,{from:p.uci.slice(0,2),to:p.uci.slice(2,4),promotion:p.uci.slice(4)||undefined});
    if(!m)break;S.moves.push({san:m.san,white:m.color==="w"});S.fens.push(g.fen());}
  if(finalFen&&S.fens.length===plies.length+1)S.fens[S.fens.length-1]=finalFen;
  S.total=total||plies.length;
}
function renderMoves(){const m=$("#moves");if(!m)return;let html="",n=0;
  S.moves.forEach((mv,i)=>{const p=S.plies[i];const v=p?p.verdict:"";const cur=i===S.ptr?" cur":"";
    const ev=p?`<span class="pill">${esc(p.eval_after)}</span>`:"";
    if(mv.white){n++;html+=`<span data-i="${i}" class="${v}${cur}">${n}. <b>${esc(mv.san)}</b>${ev}</span> `;}
    else html+=`<span data-i="${i}" class="${v}${cur}"><b>${esc(mv.san)}</b>${ev}</span> `;});
  for(let i=S.moves.length;i<S.total;i++)html+=`<span class="pill">·</span>`;
  m.innerHTML=html;m.querySelectorAll("[data-i]").forEach(s=>s.onclick=()=>goto(+s.dataset.i));
  const c=m.querySelector(".cur");                                   // keep it visible inside the list without moving the page
  if(c){const top=c.offsetTop-m.offsetTop, bottom=top+c.offsetHeight;
    if(top<m.scrollTop)m.scrollTop=top; else if(bottom>m.scrollTop+m.clientHeight)m.scrollTop=bottom-m.clientHeight;}}
function safeMove(g,mv){try{return g.move(mv);}catch(e){return null;}}      // chess.js v2 throws on an illegal move
function lineHtml(label,fen,san){if(!san)return"";let g;try{g=new Chess(fen);}catch(e){return"";}const plies=[];
  for(const tok of san.split(/\s+/)){if(/^\d+\.+$/.test(tok))continue;const m=safeMove(g,tok);if(!m)break;plies.push({san:tok,fen:g.fen(),white:m.color==="w"});}
  return `<div class="lrow"><span class="pill">${label}</span> `+plies.map((p,j)=>`<span class="ply" data-fen="${esc(p.fen)}" data-label="${esc((p.white?"White":"Black")+" plays "+p.san)}">${esc(p.san)}</span>`).join(" ")+`</div>`;}
function renderPanel(){
  const p=S.plies[S.ptr];const V=$("#verdict"),H=$("#head"),L=$("#lines"),T=$("#text"),TL=$("#textLong"),lad=$("#ladder tbody");
  if(!p){const done=S.ptr>=S.moves.length&&S.moves.length;
    V.innerHTML="";H.textContent=done?`Final position · ${esc(S.headers.Result||"")}`:(S.partial?"analysing this move…":"—");L.innerHTML="";T.textContent=done?"Use ◀ to step back through the game.":"…";TL.textContent="";lad.innerHTML="";
    setStatus(done?"end of the game":(S.partial?`analysing… ${S.plies.length}/${S.total}`:"—"));return;}
  const who=p.side==="w"?"White":"Black", num=p.side==="w"?`${p.move_no}.`:`${p.move_no}…`;
  const err=ERR.has(p.verdict);
  V.innerHTML=`<span class="tag ${esc(p.verdict)}">${esc(p.verdict)}</span> <span class="k">${num} ${esc(p.san)}</span> <span class="pill">eval ${esc(p.eval_before)} → ${esc(p.eval_after)}${p.cost&&err?" · "+esc(p.cost):""}</span>`+
    (p.computer_move?` <span class="pill">(computer move)</span>`:"");
  H.textContent=err?p.headline:(p.fact?`${p.san}: ${p.fact}`:`${p.san} — ${p.verdict}`);
  let lines="";
  if(p.best&&p.best!==p.san&&p.best_line)lines+=lineHtml("best",p.fen,p.best_line);
  if(err&&p.refutation&&p.refutation.line){const g=new Chess(p.fen);if(safeMove(g,p.san))lines+=lineHtml("punished by",g.fen(),p.refutation.line);}
  if(p.threats&&p.threats.length)lines+=`<div class="lrow"><span class="pill">if ${who} did nothing</span> ${p.threats.map(esc).join(" · ")}</div>`;
  if(p.structure&&p.structure.length)lines+=`<div class="lrow"><span class="pill">structure</span> ${p.structure.map(esc).join("; ")}</div>`;
  if(p.progress&&p.progress.length)lines+=`<div class="lrow"><span class="pill">where ${who} can make progress</span> ${p.progress.map(esc).join(" · ")}</div>`;
  if(p.horizon)lines+=`<div class="lrow"><span class="pill">horizon</span> ${esc(p.horizon)}</div>`;
  L.innerHTML=lines;
  L.querySelectorAll(".ply").forEach(s=>s.onclick=()=>showLinePosition(s.dataset.fen,s.dataset.label));
  T.textContent=p.text||"";TL.textContent=p.text_long||"";
  const keys=Object.keys(p.p_played||{}).sort();
  lad.innerHTML=(keys.length?`<tr><th class="pill">who plays it</th><th class="pill">${esc(p.san)}</th><th class="pill">${esc(p.best||"")}</th></tr>`:"")+keys.map(k=>`<tr><td>${k}</td><td><span class="bar"><i style="width:${p.p_played[k]}%"></i></span> ${p.p_played[k]}%</td>`+
    `<td><span class="bar g"><i style="width:${(p.p_best||{})[k]||0}%"></i></span> ${(p.p_best||{})[k]||0}%</td></tr>`).join("");
  setStatus(S.partial?`analysing… ${S.plies.length}/${S.total} · showing move ${S.ptr+1}`:`${who} to move before ${num} ${p.san}`);
}
function renderSummary(){const s=S.summaryData;const el=$("#summary");if(!s||!el){if(el)el.innerHTML="";return;}
  const h=S.headers;
  el.innerHTML=`<div class="pill">summary</div>`+["w","b"].map(k=>{const x=s[k];const name=k==="w"?h.White:h.Black;
    return `<div style="margin:6px 0"><b>${k==="w"?"White":"Black"} · ${esc(name||"")}</b> — ${x.moves} moves, ${x.errors} errors (${Object.entries(x.verdicts).map(([a,b])=>a+" "+b).join(", ")}) · effective rating <b>${x.effective_rating||"?"}</b> · causes: ${Object.entries(x.causes).map(([a,b])=>a+" "+b).join(", ")||"—"}`+
      x.worst.map(w=>`<div class="lrow"><a href="#game/${esc(S.gameId)}@${w.ply}">${w.side==="w"?w.move_no+".":w.move_no+"…"} ${esc(w.san)}</a> <span style="color:var(--pink)">−${w.cost_wp}</span> ${esc(w.headline||"")}</div>`).join("")+`</div>`;}).join("");}

async function openGame(gid,ply){S.view="game";
  if(S.gameId!==gid){S.gameId=gid;S.plies=[];S.fens=[];S.moves=[];S.headers={};S.partial=true;S.summaryData=null;S.ptr=ply!=null?ply:0;S.probe=null;
    if(S.side)S.flip=S.side==="b";gameLayout();}
  else if(ply!=null)S.ptr=ply;
  let r;try{r=await api("/api/game/"+gid);}catch(e){toast(e.message);return;}
  if(r.status==="done"){applyResult(r.result,false);return;}
  $("#prog").style.display="block";setStatus("fetching from Lichess…");
  poll=setInterval(async()=>{let j;try{j=await api("/api/job/"+r.job);}catch(e){return;}
    if(j.status==="error"){stopPoll();$("#prog").style.display="none";$("#text").textContent=j.error;setStatus("error");return;}
    if(j.status==="done"){stopPoll();$("#prog").style.display="none";const r2=await api("/api/game/"+gid);applyResult(r2.result,false);return;}
    const pr=j.progress||{};$("#prog").querySelector("i").style.width=(pr.total?100*pr.done/pr.total:0)+"%";
    if(j.partial&&j.partial.length>S.plies.length)applyResult({id:gid,headers:S.headers,plies:j.partial,total:pr.total,final_fen:null},true);
    else setStatus(pr.message||j.status);
  },1200);
}
/* apply a full or partial result WITHOUT rebuilding what is already on screen: the board only moves when
   the viewed ply changes; the move list appends; the panel fills in when its frame arrives */
function applyResult(res,partial){
  const hadPly=S.plies[S.ptr]!=null;const hadMoves=S.moves.length;
  S.partial=partial;S.plies=res.plies;
  if(res.headers&&res.headers.White){const h=S.headers=res.headers;
    $("#players").innerHTML=`<span><span class="name">${esc(h.White)}</span> <span class="elo">${esc(h.WhiteElo)}</span> <span class="pill">white</span></span><span class="vs">${esc(h.Result||"")}</span><span><span class="name">${esc(h.Black)}</span> <span class="elo">${esc(h.BlackElo)}</span> <span class="pill">black</span></span>`;
    $("#meta").innerHTML=`${esc((h.Event||"").replace("rated ",""))} ${esc(h.TimeControl||"")} · ${esc(h.Date||"")}<br>${esc(h.Opening||"")}${h.ECO?" ("+esc(h.ECO)+")":""}`;
    remember("game",res.id,`${h.White} vs ${h.Black} (${h.Date})`);}
  $("#lichess").href="https://lichess.org/"+res.id;
  loadMoves(res.plies,res.total,res.final_fen);
  if(!partial){S.summaryData=res.summary;renderSummary();}
  if(S.ptr>S.moves.length)S.ptr=S.moves.length;
  if(!hadMoves)setBoard();                                       // first frame: put the position up
  if(!hadPly&&S.plies[S.ptr])setBoard();                         // our frame just arrived: draw its arrows
  renderMoves();renderPanel();
}
function flagContext(){const p=S.plies[S.ptr];
  return {kind:"game",game:S.gameId,ply:S.ptr,san:p?p.san:null,fen:S.fens[S.ptr]||null,verdict:p?p.verdict:null,headline:p?(p.headline||p.fact):null,text:p?p.text:null,url:location.href};}

/* ---------- user view ---------- */
async function openUser(name){S.view="user";S.userName=name;cg=null;
  $("#main").innerHTML=`<div class="home"><b>${esc(name)}</b> <span class="pill" id="ustatus">fetching games…</span><div class="prog"><i style="width:0%"></i></div></div>`;
  let r;try{r=await api("/api/user/"+encodeURIComponent(name));}catch(e){toast(e.message);return;}
  if(r.status==="done"){showUser(r.result);return;}
  poll=setInterval(async()=>{let j;try{j=await api("/api/job/"+r.job);}catch(e){return;}
    if(j.status==="error"){stopPoll();$("#main").innerHTML=`<div class="home"><div class="box">${esc(j.error)}</div></div>`;return;}
    if(j.status==="done"){stopPoll();const r2=await api("/api/user/"+encodeURIComponent(name));showUser(r2.result);return;}
    const st=$("#ustatus");if(st)st.textContent=(j.progress||{}).message||j.status;},2000);
}
function showUser(u){remember("user",u.user,u.user);
  const errs=u.games.flatMap(g=>g.errors.filter(e=>!e.computer_move).map(e=>({...e,g}))).sort((a,b)=>b.cost_wp-a.cost_wp);
  $("#main").innerHTML=`<div class="wrap"><div class="col" style="flex:1;min-width:320px">
    <div class="row"><b>${esc(u.user)}</b><span class="pill">${u.games.length} games · ${u.n_moves} of their moves · ${esc(u.analysed_at)}</span><span style="flex:1"></span><a href="#" id="refresh" class="pill">refresh from Lichess</a><button class="flag" id="flagsum">⚑</button></div>
    <div class="summary">${esc(u.summary.join("\n"))}</div>
    <div class="pill" style="margin-top:10px">errors, biggest first</div>
    <table><thead><tr><th>cost</th><th>game</th><th>move</th><th>what happened</th></tr></thead><tbody>
      ${errs.slice(0,80).map(e=>`<tr class="link" data-g="${esc(e.g.id)}" data-p="${e.ply}" data-s="${e.g.you}"><td style="color:var(--pink)">−${e.cost_wp}</td><td>${esc(e.g.date)} · ${esc(e.g.you==="w"?e.g.black:e.g.white)}</td><td>${Math.floor(e.ply/2)+1}${e.ply%2?"…":"."} ${esc(e.san)}</td><td>${esc(e.headline)}</td></tr>`).join("")}
    </tbody></table>
    <div class="pill" style="margin-top:10px">games</div>
    <table><thead><tr><th>date</th><th>you</th><th>opponent</th><th>result</th><th>tc</th><th>opening</th><th>errors</th></tr></thead><tbody>
      ${u.games.map(g=>`<tr class="link" data-g="${esc(g.id)}" data-s="${g.you}"><td>${esc(g.date)}</td><td>${g.you==="w"?"White":"Black"}</td><td>${esc(g.you==="w"?g.black:g.white)}</td><td>${esc(g.result)}</td><td>${esc(g.tc)}</td><td>${esc(g.opening)}</td><td>${g.errors.length} / ${g.moves}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  $("#main").querySelectorAll("tr.link").forEach(tr=>tr.onclick=()=>{S.side=tr.dataset.s;go("game/"+tr.dataset.g+(tr.dataset.p?"@"+tr.dataset.p:""));});
  $("#refresh").onclick=async e=>{e.preventDefault();$("#main").innerHTML=`<div class="home"><b>${esc(u.user)}</b> <span class="pill" id="ustatus">refreshing…</span></div>`;
    const r=await api("/api/user/"+encodeURIComponent(u.user)+"?refresh=1");
    if(r.job)poll=setInterval(async()=>{const j=await api("/api/job/"+r.job);if(j.status==="done"){stopPoll();const r2=await api("/api/user/"+encodeURIComponent(u.user));showUser(r2.result);}
      else if(j.status==="error"){stopPoll();$("#main").innerHTML=`<div class="home"><div class="box">${esc(j.error)}</div></div>`;}
      else{const st=$("#ustatus");if(st)st.textContent=(j.progress||{}).message||j.status;}},2000);};
  $("#flagsum").onclick=()=>openFlag({kind:"user",user:u.user,summary:u.summary.slice(0,12),url:location.href});
}

/* ---------- flags: the queue the coder reads ---------- */
let flagCtx=null;
function openFlag(ctx){flagCtx=ctx;$("#ctx").textContent=JSON.stringify(ctx,null,1).slice(0,1500);$("#note").value="";$("#flagdlg").showModal();$("#note").focus();}
$("#flagbtn").onclick=()=>openFlag(S.view==="game"?flagContext():{kind:S.view,user:S.userName,url:location.href});
$("#cancel").onclick=()=>$("#flagdlg").close();
$("#flagform").addEventListener("submit",async e=>{e.preventDefault();
  try{const r=await api("/api/flag",{note:$("#note").value,context:flagCtx});$("#flagdlg").close();toast(`logged as #${r.id} in ${r.file}`,true);}
  catch(err){toast(err.message);}});

route();
</script>
</body>
