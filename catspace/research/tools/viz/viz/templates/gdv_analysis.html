<!doctype html>
<meta charset="utf-8">
<title>gdv analysis</title>
<link rel="stylesheet" href="/assets/chessground/chessground.base.css">
<link rel="stylesheet" href="/assets/chessground/chessground.brown.css">
<link rel="stylesheet" href="/assets/chessground/chessground.cburnett.css">
<style>
  :root{--bg:#1b1e23;--panel:#242830;--tx:#d6dae2;--dim:#8b93a3;--acc:#66d9a6;--bad:#ff7a7a}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,Menlo,monospace;display:flex;gap:16px;padding:16px}
  #board{width:560px;height:560px;flex:none}
  #side{flex:1;min-width:380px;max-width:560px;display:flex;flex-direction:column;gap:10px}
  .panel{background:var(--panel);border-radius:8px;padding:10px 12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:3px 0}
  label{color:var(--dim);font-size:12px}
  input[type=range]{width:110px}
  button{background:#333a46;color:var(--tx);border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{background:#3e4757}
  select,input[type=text]{background:#14161a;color:var(--tx);border:1px solid #3a4150;border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
  #fen{flex:1;min-width:120px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);text-align:left;font-weight:normal;border-bottom:1px solid #3a4150;padding:2px 6px}
  td{padding:3px 6px;border-bottom:1px solid #2b303a;cursor:pointer;font-variant-numeric:tabular-nums}
  tr:hover td{background:#2c313c}
  tr.best td{color:var(--acc)}
  .pv{color:var(--dim);font-size:12px}
  #status{color:var(--dim);font-size:12px;min-height:16px}
  .q-neg{color:var(--bad)} .q-pos{color:var(--acc)}
  h3{margin:2px 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
</style>
<div id="board"></div>
<div id="side">
  <div class="panel">
    <div class="row">
      <label>depth <b id="dv-depth">2</b></label><input type="range" id="depth" min="1" max="5" value="2">
      <label>beam <b id="dv-beam">6</b></label><input type="range" id="beam" min="2" max="12" value="6">
      <label>engine plays</label>
      <select id="ecolor"><option value="none">neither (analysis)</option><option value="black" selected>black</option><option value="white">white</option><option value="both">both</option></select>
    </div>
    <div class="row">
      <button id="bNew">new game</button><button id="bFlip">flip</button>
      <button id="bUndo">&#8592; undo</button><button id="bEngine">engine move</button>
      <button id="bAnalyze">re-analyze</button>
    </div>
    <div class="row"><input type="text" id="fen" placeholder="paste FEN and press enter"><button id="bCopy">copy fen</button></div>
    <div id="status"></div>
  </div>
  <div class="panel" style="flex:1;overflow:auto">
    <h3>moves <span id="meta" style="text-transform:none;letter-spacing:0"></span></h3>
    <table><thead><tr><th>#</th><th>move</th><th>prior</th><th>dV</th><th>Q(search)</th><th>d</th></tr></thead>
    <tbody id="rows"></tbody></table>
    <div class="pv" id="pvline" style="margin-top:6px"></div>
  </div>
</div>
<script type="module">
import { Chessground } from '/assets/chessground/chessground.js';
import { Chess } from '/assets/chessjs.js';
const game = new Chess();
const S = { flip:false, analysis:null, busy:false, seq:0 };
const BRUSH = ["green","blue","yellow"];
const $ = id => document.getElementById(id);
const turnColor = () => game.turn()==="w" ? "white" : "black";
function legalDests(){ const m=new Map();
  for(const mv of game.moves({verbose:true})){ if(!m.has(mv.from)) m.set(mv.from,[]); m.get(mv.from).push(mv.to);} return m; }

const cg = Chessground($("board"), cfg());
function cfg(){ return { fen: game.fen(), orientation: S.flip?"black":"white",
  turnColor: turnColor(), check: game.inCheck(),
  movable: { free:false, color: turnColor(), dests: legalDests(),
             events: { after: onUserMove } },
  animation: { duration: 120 }, drawable: { enabled: true } }; }
function sync(){ cg.set(cfg()); }

function setStatus(t){ $("status").textContent = t; }
function fmt(x,d=2){ return (x>=0?"+":"") + x.toFixed(d); }

let inflight = null;
async function analyze(){
  const seq = ++S.seq;
  if(inflight){ try{ inflight.abort(); }catch(e){} }
  inflight = new AbortController();
  const depth = +$("depth").value, beam = +$("beam").value;
  if(game.isGameOver()){ $("rows").innerHTML=""; $("meta").textContent="";
    setStatus("game over: " + (game.isCheckmate() ? (game.turn()==="w"?"black":"white")+" mates" : "draw")); return null; }
  setStatus(`thinking… d${depth} b${beam}`);
  let r;
  try{
    r = await fetch("/analyze", {method:"POST", headers:{"Content-Type":"application/json"},
      signal: inflight.signal,
      body: JSON.stringify({fen: game.fen(), depth, beam, topk: 12})});
  }catch(e){ if(e.name==="AbortError") return null; throw e; }
  if(!r.ok){ setStatus("error: "+(await r.json()).error); return null; }
  const a = await r.json();
  if(seq !== S.seq) return null;          // superseded by a newer position
  S.analysis = a;
  render(a);
  setStatus("");
  return a;
}
function render(a){
  $("meta").textContent = ` — ${a.model} · ${a.nodes} nodes · ${a.ms} ms`
    + (a.budget_hit?" · node budget hit (some moves shallow)":"") + (a.capped?" · >48 legal (tail unscored)":"");
  const tb = $("rows"); tb.innerHTML = "";
  a.rows.forEach((row,i)=>{
    const tr = document.createElement("tr"); if(i===0) tr.className="best";
    tr.innerHTML = `<td>${i+1}</td><td><b>${row.san}</b></td>`+
      `<td>${(100*row.prior_p).toFixed(1)}%</td>`+
      `<td class="${row.dv<0?'q-neg':'q-pos'}">${fmt(row.dv)}</td>`+
      `<td class="${row.q<0?'q-neg':'q-pos'}"><b>${fmt(row.q)}</b></td><td>${row.depth}</td>`;
    tr.onclick = ()=>{ $("pvline").textContent = row.pv.length ? "PV: "+row.pv.join(" ") : "(no pv at depth 1)";
      cg.setShapes([{orig: row.uci.slice(0,2), dest: row.uci.slice(2,4), brush:"green"}]); };
    tb.appendChild(tr);
  });
  cg.setShapes(a.rows.slice(0,3).map((row,i)=>({orig: row.uci.slice(0,2), dest: row.uci.slice(2,4), brush: BRUSH[i]})));
  const b = a.rows[0];
  if(b) $("pvline").textContent = b.pv.length ? "PV: "+b.pv.join(" ") : "";
}
function engineTurn(){ const c=$("ecolor").value; return c!=="none" && !game.isGameOver() && (c==="both" || turnColor()===c); }
async function maybeEngine(){
  while(engineTurn()){
    S.busy = true;
    const a = S.analysis && S.analysis.fen===game.fen() ? S.analysis : await analyze();
    S.busy = false;
    if(!a || !a.rows.length || !engineTurn()) break;
    game.move({from:a.rows[0].uci.slice(0,2), to:a.rows[0].uci.slice(2,4), promotion:a.rows[0].uci.slice(4)||"q"});
    sync(); await analyze();
    if($("ecolor").value!=="both") break;
  }
}
async function onUserMove(orig,dest){
  const mv = game.move({from:orig,to:dest,promotion:"q"});
  if(!mv){ sync(); return; }
  sync(); await analyze(); maybeEngine();
}
async function refresh(){ sync(); await analyze(); }

$("depth").oninput = e=>{ $("dv-depth").textContent=e.target.value; };
$("beam").oninput  = e=>{ $("dv-beam").textContent=e.target.value; };
$("depth").onchange = analyze; $("beam").onchange = analyze;
$("bNew").onclick = ()=>{ game.reset(); refresh(); };
$("bFlip").onclick = ()=>{ S.flip=!S.flip; sync(); };
$("bUndo").onclick = ()=>{ game.undo(); if($("ecolor").value!=="none") game.undo(); refresh(); };
$("bEngine").onclick = ()=>{ maybeEngineOnce(); };
async function maybeEngineOnce(){ const a = await analyze(); if(a && a.rows.length){
  game.move({from:a.rows[0].uci.slice(0,2), to:a.rows[0].uci.slice(2,4), promotion:a.rows[0].uci.slice(4)||"q"});
  sync(); analyze(); } }
$("bAnalyze").onclick = analyze;
$("bCopy").onclick = ()=>{ navigator.clipboard.writeText(game.fen()); setStatus("fen copied"); };
$("fen").onkeydown = e=>{ if(e.key==="Enter"){ try{ game.load(e.target.value.trim()); refresh(); }
  catch(err){ setStatus("bad fen"); } } };
$("ecolor").onchange = ()=>maybeEngine();
refresh();
</script>
